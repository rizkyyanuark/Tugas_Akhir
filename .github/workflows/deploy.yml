# Production deployment through GitHub Actions.
# Push development work to dev. Push release-ready code to master to deploy.

name: Production Deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ETL dispatch tests
        run: uv run --directory backend/package pytest knowledge/etl/tests/test_etl_dispatch.py -v

  deploy:
    name: Deploy to AWS EC2
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          CF_CONFIG: ${{ secrets.CLOUDFLARE_CONFIG }}
          CF_CREDS: ${{ secrets.CLOUDFLARE_CREDENTIALS }}
          S_GLOBAL_PASSWORD: ${{ secrets.GLOBAL_PASSWORD }}
          S_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          S_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          S_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          S_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S_NEO4J_URI: ${{ secrets.NEO4J_URI }}
          S_NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          S_NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          S_NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
          S_MILVUS_URI: ${{ secrets.MILVUS_URI }}
          S_MILVUS_TOKEN: ${{ secrets.MILVUS_TOKEN }}
          S_MILVUS_DB_NAME: ${{ secrets.MILVUS_DB_NAME }}
          S_SCIVAL_EMAIL: ${{ secrets.SCIVAL_EMAIL }}
          S_SCIVAL_PASS: ${{ secrets.SCIVAL_PASS }}
          S_SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          S_SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          S_BD_USER_SERP: ${{ secrets.BD_USER_SERP }}
          S_BD_PASS_SERP: ${{ secrets.BD_PASS_SERP }}
          S_BD_USER_UNLOCKER: ${{ secrets.BD_USER_UNLOCKER }}
          S_BD_PASS_UNLOCKER: ${{ secrets.BD_PASS_UNLOCKER }}
          S_BD_SCRAPING_BROWSER_URL: ${{ secrets.BD_SCRAPING_BROWSER_URL }}
          S_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          S_SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          S_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          S_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_GEMINI_API_KEY_JUDGE: ${{ secrets.GEMINI_API_KEY_JUDGE }}
          S_HF_TOKEN: ${{ secrets.HF_TOKEN }}
          S_TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          S_OPIK_API_KEY: ${{ secrets.OPIK_API_KEY }}
          S_OPIK_WORKSPACE: ${{ secrets.OPIK_WORKSPACE }}
          S_OPIK_PROJECT_NAME: ${{ secrets.OPIK_PROJECT_NAME }}
          S_OPIK_ENVIRONMENT: ${{ secrets.OPIK_ENVIRONMENT }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_AIRFLOW_FERNET_KEY: ${{ secrets.AIRFLOW__CORE__FERNET_KEY }}
          S_AIRFLOW_SECRET_KEY: ${{ secrets.AIRFLOW_SECRET_KEY }}
          S_AIRFLOW_JWT_SECRET: ${{ secrets.AIRFLOW_JWT_SECRET }}
          S_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: >-
            CF_CONFIG,CF_CREDS,
            S_GLOBAL_PASSWORD,S_JWT_SECRET_KEY,
            S_SUPABASE_URL,S_SUPABASE_KEY,S_SUPABASE_SERVICE_ROLE_KEY,
            S_NEO4J_URI,S_NEO4J_USERNAME,S_NEO4J_PASSWORD,S_NEO4J_DATABASE,
            S_MILVUS_URI,S_MILVUS_TOKEN,S_MILVUS_DB_NAME,
            S_SCIVAL_EMAIL,S_SCIVAL_PASS,S_SEMANTIC_SCHOLAR_API_KEY,S_SERPAPI_KEY,
            S_BD_USER_SERP,S_BD_PASS_SERP,S_BD_USER_UNLOCKER,S_BD_PASS_UNLOCKER,
            S_BD_SCRAPING_BROWSER_URL,
            S_GROQ_API_KEY,S_SILICONFLOW_API_KEY,S_OPENROUTER_API_KEY,
            S_DEEPSEEK_API_KEY,S_GEMINI_API_KEY,S_GEMINI_API_KEY_JUDGE,
            S_HF_TOKEN,S_TAVILY_API_KEY,
            S_OPIK_API_KEY,S_OPIK_WORKSPACE,S_OPIK_PROJECT_NAME,S_OPIK_ENVIRONMENT,
            S_TELEGRAM_BOT_TOKEN,
            S_AIRFLOW_FERNET_KEY,S_AIRFLOW_SECRET_KEY,S_AIRFLOW_JWT_SECRET,
            S_AWS_ACCESS_KEY_ID,S_AWS_SECRET_ACCESS_KEY
          command_timeout: 25m
          script: |
            set -e

            echo "== Production deployment started =="

            if [ ! -d ~/Tugas_Akhir ]; then
              git clone https://github.com/rizkyyanuark/Tugas_Akhir.git ~/Tugas_Akhir
            fi

            cd ~/Tugas_Akhir
            mkdir -p cloudflared data

            echo "[1/7] Syncing origin/master"
            git stash --quiet 2>/dev/null || true
            git fetch origin master
            git checkout -B master origin/master
            git reset --hard origin/master

            echo "[2/7] Generating .env from GitHub Secrets"
            : "${S_GLOBAL_PASSWORD:?Missing GitHub Secret GLOBAL_PASSWORD}"
            : "${S_JWT_SECRET_KEY:?Missing GitHub Secret JWT_SECRET_KEY}"
            : "${S_SUPABASE_URL:?Missing GitHub Secret SUPABASE_URL}"
            : "${S_SUPABASE_KEY:?Missing GitHub Secret SUPABASE_KEY}"
            : "${S_SUPABASE_SERVICE_ROLE_KEY:?Missing GitHub Secret SUPABASE_SERVICE_ROLE_KEY}"
            : "${S_NEO4J_URI:?Missing GitHub Secret NEO4J_URI}"
            : "${S_NEO4J_USERNAME:?Missing GitHub Secret NEO4J_USERNAME}"
            : "${S_NEO4J_PASSWORD:?Missing GitHub Secret NEO4J_PASSWORD}"
            : "${S_NEO4J_DATABASE:?Missing GitHub Secret NEO4J_DATABASE}"
            : "${S_MILVUS_URI:?Missing GitHub Secret MILVUS_URI}"
            : "${S_MILVUS_TOKEN:?Missing GitHub Secret MILVUS_TOKEN}"
            : "${S_MILVUS_DB_NAME:?Missing GitHub Secret MILVUS_DB_NAME}"
            : "${S_OPIK_API_KEY:?Missing GitHub Secret OPIK_API_KEY}"
            : "${S_OPIK_WORKSPACE:?Missing GitHub Secret OPIK_WORKSPACE}"
            : "${S_OPIK_PROJECT_NAME:?Missing GitHub Secret OPIK_PROJECT_NAME}"
            : "${S_OPIK_ENVIRONMENT:?Missing GitHub Secret OPIK_ENVIRONMENT}"
            : "${CF_CONFIG:?Missing GitHub Secret CLOUDFLARE_CONFIG}"
            : "${CF_CREDS:?Missing GitHub Secret CLOUDFLARE_CREDENTIALS}"
            cat > .env << ENVEOF
            # Auto-generated by GitHub Actions. Do not edit on the server.
            GLOBAL_PASSWORD=${S_GLOBAL_PASSWORD}
            JWT_SECRET_KEY=${S_JWT_SECRET_KEY}
            SUPABASE_URL=${S_SUPABASE_URL}
            SUPABASE_KEY=${S_SUPABASE_KEY}
            SUPABASE_SERVICE_ROLE_KEY=${S_SUPABASE_SERVICE_ROLE_KEY}
            NEO4J_URI=${S_NEO4J_URI}
            NEO4J_USERNAME=${S_NEO4J_USERNAME}
            NEO4J_PASSWORD=${S_NEO4J_PASSWORD}
            NEO4J_DATABASE=${S_NEO4J_DATABASE}
            MILVUS_URI=${S_MILVUS_URI}
            MILVUS_TOKEN=${S_MILVUS_TOKEN}
            MILVUS_DB_NAME=${S_MILVUS_DB_NAME}
            SCIVAL_EMAIL=${S_SCIVAL_EMAIL}
            SCIVAL_PASS=${S_SCIVAL_PASS}
            SEMANTIC_SCHOLAR_API_KEY=${S_SEMANTIC_SCHOLAR_API_KEY}
            SERPAPI_KEY=${S_SERPAPI_KEY}
            BD_USER_SERP=${S_BD_USER_SERP}
            BD_PASS_SERP=${S_BD_PASS_SERP}
            BD_USER_UNLOCKER=${S_BD_USER_UNLOCKER}
            BD_PASS_UNLOCKER=${S_BD_PASS_UNLOCKER}
            BD_SCRAPING_BROWSER_URL=${S_BD_SCRAPING_BROWSER_URL}
            GROQ_API_KEY=${S_GROQ_API_KEY}
            SILICONFLOW_API_KEY=${S_SILICONFLOW_API_KEY}
            OPENROUTER_API_KEY=${S_OPENROUTER_API_KEY}
            DEEPSEEK_API_KEY=${S_DEEPSEEK_API_KEY}
            GEMINI_API_KEY=${S_GEMINI_API_KEY}
            GEMINI_API_KEY_JUDGE=${S_GEMINI_API_KEY_JUDGE}
            HF_TOKEN=${S_HF_TOKEN}
            TAVILY_API_KEY=${S_TAVILY_API_KEY}
            OPIK_ENABLED=true
            OPIK_API_KEY=${S_OPIK_API_KEY}
            OPIK_WORKSPACE=${S_OPIK_WORKSPACE}
            OPIK_PROJECT_NAME=${S_OPIK_PROJECT_NAME}
            OPIK_ENVIRONMENT=${S_OPIK_ENVIRONMENT}
            TELEGRAM_BOT_TOKEN=${S_TELEGRAM_BOT_TOKEN}
            AIRFLOW__CORE__FERNET_KEY=${S_AIRFLOW_FERNET_KEY}
            AIRFLOW_SECRET_KEY=${S_AIRFLOW_SECRET_KEY}
            AIRFLOW_JWT_SECRET=${S_AIRFLOW_JWT_SECRET}
            AWS_ACCESS_KEY_ID=${S_AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY=${S_AWS_SECRET_ACCESS_KEY}
            ENVEOF
            sed -i 's/^[[:space:]]*//' .env
            chmod 600 .env

            echo "[3/7] Writing Cloudflare Tunnel runtime files"
            sudo chown -R "$(id -u):$(id -g)" cloudflared || true
            printf '%s\n' "$CF_CONFIG" > cloudflared/config.yaml
            printf '%s\n' "$CF_CREDS" > cloudflared/credentials.json
            chmod 644 cloudflared/config.yaml
            sudo chown 65532:65532 cloudflared/credentials.json
            sudo chmod 600 cloudflared/credentials.json

            echo "[4/7] Preparing EC2 host"
            chmod +x scripts/setup-server.sh
            bash scripts/setup-server.sh
            df -h /

            echo "[5/7] Removing old Docker build artifacts"
            docker system prune -af --volumes || true
            docker builder prune -af || true
            sudo apt-get clean || true

            echo "[6/7] Building and starting services"
            docker compose -f docker-compose.prod.yml --profile etl build
            docker compose -f docker-compose.prod.yml --profile etl up -d --remove-orphans

            echo "[6.5/7] Waiting for service health"
            api_status="unknown"
            for i in $(seq 1 24); do
              api_status=$(docker inspect -f '{{.State.Health.Status}}' api-prod 2>/dev/null || echo "unknown")
              if [ "$api_status" = "healthy" ]; then break; fi
              echo "api_status=$api_status"
              sleep 5
            done
            if [ "$api_status" != "healthy" ]; then
              docker logs --tail=200 api-prod || true
              exit 1
            fi

            airflow_status="unknown"
            for i in $(seq 1 24); do
              airflow_status=$(docker inspect -f '{{.State.Health.Status}}' airflow-webserver-prod 2>/dev/null || echo "unknown")
              if [ "$airflow_status" = "healthy" ]; then break; fi
              echo "airflow_status=$airflow_status"
              sleep 5
            done
            if [ "$airflow_status" != "healthy" ]; then
              docker logs --tail=200 airflow-webserver-prod || true
              exit 1
            fi

            dag_processor_status="unknown"
            for i in $(seq 1 24); do
              dag_processor_status=$(docker inspect -f '{{.State.Health.Status}}' airflow-dag-processor-prod 2>/dev/null || echo "unknown")
              if [ "$dag_processor_status" = "healthy" ]; then break; fi
              echo "dag_processor_status=$dag_processor_status"
              sleep 5
            done
            if [ "$dag_processor_status" != "healthy" ]; then
              docker logs --tail=200 airflow-dag-processor-prod || true
              exit 1
            fi

            kg_dag_registered="false"
            for i in $(seq 1 24); do
              if docker exec airflow-dag-processor-prod airflow dags list 2>/dev/null | grep -q "unesa_kg_construction"; then
                kg_dag_registered="true"
                break
              fi
              echo "Waiting for unesa_kg_construction DAG registration"
              sleep 5
            done
            if [ "$kg_dag_registered" != "true" ]; then
              docker exec airflow-dag-processor-prod airflow dags list-import-errors || true
              docker logs --tail=200 airflow-dag-processor-prod || true
              exit 1
            fi

            echo "[7/7] Removing old unused images"
            docker image prune -af --filter "until=168h"

            echo "Production deployment complete"
            echo "frontend https://app.tugasakhir.space"
            echo "api      https://api.tugasakhir.space"
            echo "airflow  https://airflow.tugasakhir.space"
