# ══════════════════════════════════════════════════════════════
# Production Deployment (CD) — GitHub Actions
# ══════════════════════════════════════════════════════════════
# Triggers: Push to master, or manual dispatch from GitHub UI.
#
# Required GitHub Secrets:
#   - REMOTE_HOST         : EC2 Public IP
#   - REMOTE_USER         : SSH username (e.g., ubuntu)
#   - SSH_PRIVATE_KEY      : Contents of .pem file
#   - DOT_ENV             : Full contents of .env file
#   - AIRFLOW_VARIABLES   : Full contents of airflow_variables_import.json
# ══════════════════════════════════════════════════════════════

name: 🚀 Production Deployment

on:
  push:
    branches: [master]
  workflow_dispatch: # Manual trigger dari GitHub UI

# Prevent concurrent deployments — queue any new push
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run ETL dispatch tests
        env:
          PYTHONPATH: backend/package
        run: python -m pytest backend/package/knowledge/etl/tests/test_etl_dispatch.py -v

  deploy:
    name: Deploy to AWS EC2
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          AIRFLOW_VARS: ${{ secrets.AIRFLOW_VARIABLES }}
          CF_CONFIG: ${{ secrets.CLOUDFLARE_CONFIG }}
          CF_CREDS: ${{ secrets.CLOUDFLARE_CREDENTIALS }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOT_ENV,AIRFLOW_VARS,CF_CONFIG,CF_CREDS
          # script_stop: true (Removed to fix warning: Unexpected input)
          command_timeout: 25m
          script: |
            set -e

            echo "═══════════════════════════════════════"
            echo "  🚀 Starting Production Deployment"
            echo "═══════════════════════════════════════"

            # --- 0. Ensure repo and directories exist ---
            if [ ! -d ~/Tugas_Akhir ]; then
              echo "📥 First-time setup: cloning repository..."
              git clone https://github.com/rizkyyanuark/Tugas_Akhir.git ~/Tugas_Akhir
            fi

            cd ~/Tugas_Akhir
            mkdir -p cloudflared

            # --- 1. Pull latest code ---
            echo ""
            echo "📥 [1/5] Syncing code (Force Rewrite History)..."
            git stash --quiet 2>/dev/null || true
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            # --- 2. Inject config files from GitHub Secrets ---
            echo "🔑 [2/5] Writing config files..."
            printf '%s\n' "$DOT_ENV" > .env
            printf '%s\n' "$AIRFLOW_VARS" > orchestration/airflow_variables_import.json
            printf '%s\n' "$CF_CONFIG" > cloudflared/config.yaml
            printf '%s\n' "$CF_CREDS" > cloudflared/credentials.json

            # --- 3. Run server setup (swap, dirs, IP, password resolution) ---
            echo "⚙️  [3/5] Running server setup..."
            chmod +x setup-server.sh
            ./setup-server.sh

            echo "📊 [4/7] Disk Diagnostics (Verifying 40GB+)..."
            df -h /

            echo "🧹 [5/7] Fresh Start: Cleaning previous artifacts..."
            docker system prune -af --filter "until=168h" || true
            docker builder prune -af --filter "until=168h" || true
            sudo apt-get clean || true

            echo "🐳 [6/7] Building Docker images..."
            docker compose -f docker-compose.prod.yml --profile etl build

            echo "🚀 [6.5/7] Starting services..."
            docker compose -f docker-compose.prod.yml --profile etl up -d --remove-orphans

            echo "HEALTH [6.7/7] Waiting for services..."
            api_status="unknown"
            for i in $(seq 1 24); do
              api_status=$(docker inspect -f '{{.State.Health.Status}}' api-prod 2>/dev/null || echo "unknown")
              if [ "$api_status" = "healthy" ]; then
                break
              fi
              echo "Waiting for API health... status=$api_status"
              sleep 5
            done

            if [ "$api_status" != "healthy" ]; then
              echo "API did not become healthy in time"
              docker logs --tail=200 api-prod || true
              exit 1
            fi

            airflow_status="unknown"
            for i in $(seq 1 24); do
              airflow_status=$(docker inspect -f '{{.State.Health.Status}}' airflow-webserver-prod 2>/dev/null || echo "unknown")
              if [ "$airflow_status" = "healthy" ]; then
                break
              fi
              echo "Waiting for Airflow health... status=$airflow_status"
              sleep 5
            done

            if [ "$airflow_status" != "healthy" ]; then
              echo "Airflow did not become healthy in time"
              docker logs --tail=200 airflow-webserver-prod || true
              exit 1
            fi

            # --- 6. Final Cleanup ---
            echo "🧹 [7/7] Final cleanup..."
            docker image prune -af --filter "until=168h"

            echo ""
            echo "═══════════════════════════════════════"
            echo "  ✅ Deployment Complete!"
            echo "  🌐 Frontend : http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || echo 'SERVER')"
            echo "  📊 Airflow  : http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || echo 'SERVER'):8080"
            echo "═══════════════════════════════════════"
