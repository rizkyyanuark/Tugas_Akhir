# Organization information configuration file
# Used to configure basic website information and branding

# Organization information
organization:
  name: "Yunesa" # Full organization name
  logo: "/favicon.svg" # Logo file path (in web/public)
  avatar: "/avatar.jpg" # Avatar file path (in web/public)
  login_bg: "/login-bg.jpg" # Login background image path (in web/public)

# Project information
branding:
  name: "Yunesa"
  title: "Yunesa Knowledge Engine" # System title
  subtitle: "Text-first academic knowledge assistant powered by Neo4j graph context and Milvus vector search" # Used when subtitles is empty
  subtitles:
    - "Ask text questions over connected academic knowledge"
    - "Ground answers with Neo4j graph context and Milvus vector retrieval"
    - "Explore lecturer, publication, and institutional relationships"
    - "Keep the thesis scope focused: query, retrieve, reason, answer"

features:
  - label: "GitHub Stars"
    value: "0+"
    description: "Student thesis project in active development"
    icon: "stars"
  - label: "Active Project"
    value: "V0.6.0"
    description: "Dockerized API, web, ETL, Airflow, Neo4j, and Milvus stack"
    icon: "issues"
  - label: "Total Commits"
    value: "100+"
    description: "Focused iterations toward graph and vector knowledge retrieval"
    icon: "commits"
  - label: "Open-Source License"
    value: "MIT License"
    description: "Readable foundation for academic review and demonstration"
    icon: "license"

actions:
  - name: "Documentation Center"
    icon: "docs"
    url: "https://github.com/rizkyyanuark/Tugas_Akhir#readme"
  - name: "Submit Issue"
    icon: "issue"
    url: "https://github.com/rizkyyanuark/Tugas_Akhir/issues/new"
  - name: "Repository"
    icon: "github"
    url: "https://github.com/rizkyyanuark/Tugas_Akhir"

# Footer information
footer:
  copyright: "(C) Yunesa Knowledge Engine 2026 v0.6.0"
  user_agreement_url: "/protocols/user-agreement.template.html"
  privacy_policy_url: "/protocols/privacy-policy.template.html"
