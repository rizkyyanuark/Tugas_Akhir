[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "YUnesa"
version = "0.6.2.dev1"
description = "YUnesa intelligent knowledge base and knowledge graph platform core package"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-sandbox>=0.0.26",
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.26.3",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.12.3",
    "colorlog>=6.9.0",
    "deepagents>=0.2.5",
    "fastapi>=0.121",
    "fsspec>=2025.0.0",
    "groq>=0.18.0",
    "httpx>=0.27.0",
    "json-repair>=0.54.0",
    "langchain>=1.2.0",
    "langchain-core>=1.2.5",
    "langchain-deepseek>=1.0.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=1.0.2",
    "langchain-tavily>=0.2.13",
    "langchain-text-splitters>=1.0.0",
    "langfuse>=4.0.0",
    "langgraph>=1.0.1",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "lightrag-hku>=1.4.6",
    "loguru>=0.7.3",
    "mcp>=1.20.0",
    "minio>=7.2.7",
    "neo4j>=5.28.1",
    "networkx>=3.5",
    "numpy<2.0.0",
    "openai>=1.109.0",
    "opik>=1.0.0",
    "pandas>=2.2.3",
    "pddiktipy>=2.0.6",
    "pillow>=10.5.0",
    "pyarrow>=19.0.0",
    "psycopg[binary,pool]>=3.3.3",
    "PyJWT>=2.8.0",
    "pydantic[email]>=2.10.6",
    "pydantic-settings>=2.7.1",
    "pymilvus>=2.5.8",
    "pypinyin>=0.55.0",
    "python-dotenv>=1.1.0",
    "python-docx>=1.1.2",
    "python-jose[cryptography]>=3.4.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "redis>=5.2.0",
    "requests>=2.32.3",
    "rdflib>=6.3.1",
    "s3fs>=2025.0.0",
    "selenium>=4.21.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "supabase>=2.13.0",
    "tavily-python>=0.7.0",
    "tenacity>=8.0.0",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "tqdm>=4.66.4",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.34.2",
    "webdriver-manager>=4.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12.1",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "pytest-cov>=6.0.0",
]
kg = [
    "gliner>=0.2.26",
    "torch>=2.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["yunesa*", "knowledge*"]
[tool.uv]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
YUnesa = { path = ".", editable = true }
