# ══════════════════════════════════════════════════════════════
# docker-compose.prod.yml — Production (AWS EC2)
# ══════════════════════════════════════════════════════════════
# Usage:
#   docker-compose -f docker-compose.prod.yml --profile etl up -d --build
#
# IMPORTANT: All passwords MUST be set in .env file.
# Compose will refuse to start if required secrets are missing.
# ══════════════════════════════════════════════════════════════

x-api-worker-env: &api-worker-env
  RUNNING_IN_DOCKER: "true"
  LITE_MODE: ${LITE_MODE:-false}
  YUNESA_ENV: production
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
  MODEL_DIR_IN_DOCKER: /models
  # --- Database & Infrastructure (resolved from GLOBAL_PASSWORD) ---
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_KEY: ${SUPABASE_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_KEY:-}}
  POSTGRES_URL: postgresql+asyncpg://postgres:${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}@postgres:5432/postgres
  REDIS_URL: redis://redis:6379/0
  NEO4J_URI: ${NEO4J_URI:-bolt://graph:7687}
  NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}}
  NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
  MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
  MILVUS_TOKEN: ${MILVUS_TOKEN:-}
  MILVUS_DB_NAME: ${MILVUS_DB_NAME:-yunesa_know}
  MINIO_URI: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yunesa}
  MINIO_ROOT_PASSWORD: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-/minio}
  SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
  # --- Non-secret config (hardcoded defaults) ---
  OPIK_ENABLED: ${OPIK_ENABLED:-true}
  OPIK_API_KEY: ${OPIK_API_KEY:-}
  OPIK_WORKSPACE: ${OPIK_WORKSPACE:-rizkyyanuark}
  OPIK_PROJECT_NAME: ${OPIK_PROJECT_NAME:-yunesa-academic-graphrag}
  OPIK_ENVIRONMENT: ${OPIK_ENVIRONMENT:-production}
  BACKEND_RELOAD: "false"
  LANGGRAPH_CHECKPOINTER_BACKEND: postgres
  NO_PROXY: localhost,127.0.0.1,milvus,graph,minio,etcd
  no_proxy: localhost,127.0.0.1,milvus,graph,minio,etcd

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: tugas-akhir-airflow:prod
  profiles: ["etl"]
  logging: *default-logging
  networks:
    - app-network
  env_file:
    - .env
  environment:
    AIRFLOW_ENV: production
    ENVIRONMENT: prod
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}@postgres:5432/postgres
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY required}
    AIRFLOW__WEBSERVER__RBAC: "true"
    AIRFLOW__LOGGING__LOG_CLEANUP_LOGS: "true"
    AIRFLOW__LOGGING__LOG_RETENTION_DAYS: "7"
    DOCKER_NETWORK: tugas-akhir-network
    HOST_DATA_DIR: ${HOST_DATA_DIR:-/home/ubuntu/Tugas_Akhir/data}
    HOST_PACKAGE_DIR: ${HOST_PACKAGE_DIR:-/home/ubuntu/Tugas_Akhir/backend/package}
    ETL_WORKER_IMAGE: ${ETL_WORKER_IMAGE:-tugas-akhir-etl-worker:prod}
    ETL_WORKER_MOUNT_CODE: "false"
    ETL_RUN_MODE: ${ETL_RUN_MODE:-incremental}
    ETL_SAMPLE_SIZE: ${ETL_SAMPLE_SIZE:-50}
    ETL_ENRICH_MAX_PAPERS_PER_RUN: ${ETL_ENRICH_MAX_PAPERS_PER_RUN:-0}
    ETL_STORAGE_TYPE: ${ETL_STORAGE_TYPE:-local}
    ETL_FORCE_EXTRACT: ${ETL_FORCE_EXTRACT:-false}
    ETL_FRESHNESS_HOURS: ${ETL_FRESHNESS_HOURS:-72}
    # --- Airflow Variables (Auto-injected from .env) ---
    AIRFLOW_VAR_SUPABASE_URL_SECRET: ${SUPABASE_URL}
    AIRFLOW_VAR_SUPABASE_KEY_SECRET: ${SUPABASE_KEY}
    AIRFLOW_VAR_SUPABASE_SERVICE_ROLE_KEY_SECRET: ${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_KEY:-}}
    AIRFLOW_VAR_SCIVAL_EMAIL_SECRET: ${SCIVAL_EMAIL}
    AIRFLOW_VAR_SCIVAL_PASS_SECRET: ${SCIVAL_PASS}
    AIRFLOW_VAR_SEMANTIC_SCHOLAR_API_KEY_SECRET: ${SEMANTIC_SCHOLAR_API_KEY:-${S2_API_KEY:-}}
    AIRFLOW_VAR_BD_USER_UNLOCKER_SECRET: ${BD_USER_UNLOCKER}
    AIRFLOW_VAR_BD_PASS_UNLOCKER_SECRET: ${BD_PASS_UNLOCKER}
    AIRFLOW_VAR_BD_USER_SERP_SECRET: ${BD_USER_SERP}
    AIRFLOW_VAR_BD_PASS_SERP_SECRET: ${BD_PASS_SERP}
    AIRFLOW_VAR_GROQ_API_KEY_SECRET: ${GROQ_API_KEY}
    AIRFLOW_VAR_BRIGHT_DATA_HOST: "brd.superproxy.io:33335"
    # --- Airflow 3 Task Execution API ---
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET required}
    AIRFLOW__API__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.session,airflow.sdk.api.auth.backend.token

services:
  # ════════════════════════════════════════════════════════════
  # CORE APPLICATION
  # ════════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: tugas-akhir-api:prod
    container_name: api-prod
    restart: always
    logging: *default-logging
    mem_limit: 2g
    memswap_limit: 3g
    volumes:
      - ./saves:/app/saves
      - ${MODEL_DIR:-./models}:/models
    networks:
      - app-network
    env_file:
      - .env
    environment:
      <<: *api-worker-env
    command: uvicorn server.main:app --host 0.0.0.0 --port 5050
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/api/system/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: tugas-akhir-api:prod
    container_name: worker-prod
    restart: always
    logging: *default-logging
    mem_limit: 2g
    memswap_limit: 3g
    volumes:
      - ./saves:/app/saves
      - ${MODEL_DIR:-./models}:/models
    networks:
      - app-network
    env_file:
      - .env
    environment:
      <<: *api-worker-env
    command: arq server.worker_main.WorkerSettings
    # arq is a background job processor (no HTTP server),
    # so disable the image's inherited HTTP health check
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    image: tugas-akhir-web:prod
    container_name: web-prod
    restart: always
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    # NOTE: Nginx reverse proxy handles /api/ -> api:5050
    # No VITE_API_URL needed at runtime — it's baked at build time.

  # ════════════════════════════════════════════════════════════
  # DATABASES & INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════
  graph:
    image: neo4j:5.26
    container_name: graph-prod
    profiles: ["local-kg"]
    restart: always
    logging: *default-logging
    mem_limit: 768m
    environment:
      - NEO4J_AUTH=neo4j/${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - app-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd-prod
    profiles: ["local-kg"]
    restart: always
    logging: *default-logging
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio-prod
    restart: always
    logging: *default-logging
    mem_limit: 256m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yunesa}
      MINIO_ROOT_PASSWORD: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
    volumes:
      - minio-data:/minio_data
      - minio-config:/root/.minio
    command: minio server /minio_data --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: milvus-prod
    profiles: ["local-kg"]
    restart: always
    logging: *default-logging
    mem_limit: 512m
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-yunesa}
      MINIO_SECRET_ACCESS_KEY: ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
      MILVUS_LOG_LEVEL: error
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 60s
      start_period: 120s
      timeout: 30s
      retries: 5
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16
    container_name: postgres-prod
    restart: always
    logging: *default-logging
    mem_limit: 512m
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required}
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    restart: always
    logging: *default-logging
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - app-network

  # ════════════════════════════════════════════════════════════
  # ETL & ORCHESTRATION (Profile: etl)
  # ════════════════════════════════════════════════════════════
  etl-worker:
    build:
      context: .
      dockerfile: docker/etl-worker.Dockerfile
      args:
        ETL_INSTALL_TEST_DEPS: "false"
    image: tugas-akhir-etl-worker:prod
    profiles: ["etl"]
    restart: "no"
    logging: *default-logging
    env_file:
      - .env
    networks:
      - app-network
    environment:
      <<: *api-worker-env
      PYTHONPATH: /app/package
      PYTHONDONTWRITEBYTECODE: "1"
      ETL_RUN_MODE: ${ETL_RUN_MODE:-incremental}
      ETL_SAMPLE_SIZE: ${ETL_SAMPLE_SIZE:-50}
      ETL_ENRICH_MAX_PAPERS_PER_RUN: ${ETL_ENRICH_MAX_PAPERS_PER_RUN:-0}
      ETL_STORAGE_TYPE: ${ETL_STORAGE_TYPE:-local}
      ETL_FORCE_EXTRACT: ${ETL_FORCE_EXTRACT:-false}
      ETL_FRESHNESS_HOURS: ${ETL_FRESHNESS_HOURS:-72}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init-prod
    depends_on:
      postgres:
        condition: service_healthy

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password ${GLOBAL_PASSWORD:?GLOBAL_PASSWORD required} --firstname Airflow --lastname Admin --role Admin --email admin@example.com || true
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver-prod
    restart: always
    logging: *default-logging
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/public/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: api-server

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler-prod
    restart: always
    logging: *default-logging
    # Run as root to access Docker socket for DockerOperator → etl-worker.
    # Only the scheduler needs this; webserver stays as default airflow user.
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    container_name: cloudflare-tunnel
    restart: always
    logging: *default-logging
    networks:
      - app-network
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    command: tunnel --config /etc/cloudflared/config.yaml run
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

networks:
  app-network:
    driver: bridge
    name: tugas-akhir-network

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  etcd-data:
  minio-data:
  minio-config:
  milvus-data:
  redis-data:
  airflow-logs:
