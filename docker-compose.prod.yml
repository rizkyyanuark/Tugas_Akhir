# docker-compose.prod.yml
x-api-worker-env: &api-worker-env
  HOST_IP: ${HOST_IP}
  LITE_MODE: ${LITE_MODE:-false}
  RUNNING_IN_DOCKER: "true"
  MODEL_DIR_IN_DOCKER: /models
  POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  NEO4J_URI: bolt://graph:7687
  NEO4J_USERNAME: ${NEO4J_USERNAME}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  MILVUS_URI: http://milvus:19530
  MILVUS_DB_NAME: default
  MINIO_URI: http://minio:9000
  SANDBOX_PROVIDER: provisioner
  SANDBOX_PROVISIONER_URL: http://sandbox-provisioner:8002

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: tugas-akhir-airflow:prod
  profiles: ["etl"]
  networks:
    - app-network
  env_file:
    - .env
  environment:
    AIRFLOW_ENV: production
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__RBAC: "true"
    DOCKER_NETWORK: tugas-akhir-network
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    # Penting untuk AWS/Ubuntu:
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: tugas-akhir-api:prod
    container_name: api-prod
    restart: always
    volumes:
      - ./saves:/app/saves
      - ./.env:/app/.env
      - ${MODEL_DIR:-./models}:/models
    ports:
      - "5050:5050"
    networks:
      - app-network
    environment:
      <<: *api-worker-env
    command: uv run uvicorn server.main:app --host 0.0.0.0 --port 5050

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: tugas-akhir-api:prod
    container_name: worker-prod
    restart: always
    volumes:
      - ./saves:/app/saves
      - ./.env:/app/.env
      - ${MODEL_DIR:-./models}:/models
    networks:
      - app-network
    environment:
      <<: *api-worker-env
    command: uv run arq server.worker_main.WorkerSettings

  sandbox-provisioner:
    build:
      context: ./docker/sandbox_provisioner
      dockerfile: Dockerfile
    image: tugas-akhir-sandbox-provisioner:prod
    container_name: sandbox-provisioner
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8002:8002"
    networks:
      - app-network
    environment:
      - PROVISIONER_BACKEND=docker
      - DOCKER_NETWORK=tugas-akhir-network
    command: uvicorn app:app --host 0.0.0.0 --port 8002

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    image: tugas-akhir-web:prod
    container_name: web-prod
    restart: always
    ports:
      - "80:80"
    networks:
      - app-network
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://${HOST_IP}:5050 # Menggunakan variabel HOST_IP agar otomatis

  graph:
    image: neo4j:5.26
    container_name: graph-prod
    restart: always
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    networks:
      - app-network

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: milvus-prod
    restart: always
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    networks:
      - app-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd-prod
    restart: always
    command: etcd -advertise-client-urls http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio-prod
    restart: always
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network

  postgres:
    image: postgres:16
    container_name: postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    restart: always
    networks:
      - app-network

  etl-worker:
    build:
      context: .
      dockerfile: docker/etl-worker.Dockerfile
    image: tugas-akhir-etl-worker:prod
    profiles: ["etl"]
    restart: always
    env_file:
      - .env
    networks:
      - app-network

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init-prod
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Airflow --lastname Admin --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver-prod
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler-prod
    restart: always
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

networks:
  app-network:
    name: tugas-akhir-network

volumes:
  postgres-data:
  neo4j-data:
  minio-data:
  airflow-logs:
