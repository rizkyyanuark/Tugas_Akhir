# .gitlab-ci.yml — Automated CI/CD Pipeline for UNESA Academic KG
# ==============================================================================
# Stages:
#  1. test   : Validates Python syntax, ontology schema, and core imports.
#  2. deploy : Deploys updated containers to lecturer's GCP VM via SSH.
# ==============================================================================

stages:
  - test
  - deploy

# ── 1. TEST STAGE ─────────────────────────────────────────────────────────────
test_ontology_and_schema:
  stage: test
  image: python:3.11-slim
  variables:
    GROQ_API_KEY: "ci-dummy-token"
    LITE_MODE: "true"
  before_script:
    - pip install uv
  script:
    - 'echo "Running ontology integrity and syntax checks..."'
    - 'python -c "import sys; print(\"Python runtime:\", sys.version)"'
    - 'uv run --project backend python -c "from yunesa.knowledge.constants import ONTOLOGY_RELATIONS, DEFAULT_GLINER_MODEL; print(\"Loaded Ontology Relations:\", len(ONTOLOGY_RELATIONS)); print(\"Configured GLiNER Model:\", DEFAULT_GLINER_MODEL)"'
  only:
    - main
    - master
    - Eksperimen
    - dev
    - merge_requests

# ── 2. DEPLOY STAGE (GCP VM) ──────────────────────────────────────────────────
deploy_to_gcp_vm:
  stage: deploy
  image: debian:bookworm-slim
  variables:
    TARGET_HOST: "$GCP_SERVER_IP"
    TARGET_USER: "$GCP_SERVER_USER"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client curl
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$GCP_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - echo "" >> ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - 'echo "Deploying commit $CI_COMMIT_SHORT_SHA ($CI_COMMIT_REF_NAME) to GCP VM at $TARGET_HOST..."'
    - 'ssh $TARGET_USER@$TARGET_HOST "cd /home/$TARGET_USER/Tugas_Akhir && sudo git fetch origin && sudo git checkout $CI_COMMIT_REF_NAME && sudo git reset --hard origin/$CI_COMMIT_REF_NAME && sudo docker compose -f docker-compose.prod.yml up -d --build api worker web"'
    - 'echo "Verifying GCP VM health status..."'
    - 'sleep 15'
    - 'curl -f "http://$TARGET_HOST:5050/api/system/health" || curl -f "http://$TARGET_HOST:5050/health" || echo "Warning: Health endpoint check timed out"'
  only:
    - main
    - master
    - Eksperimen
  environment:
    name: production
    url: "http://$GCP_SERVER_IP:5050/api/system/health"

